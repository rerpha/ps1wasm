[package]
name = "ps1wasm-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ps1wasm-core = { path = "../core" }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "Text",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData",
  "HtmlInputElement", "HtmlButtonElement", "FileList", "File", "Blob",
  "Event", "EventTarget", "KeyboardEvent",
  "AudioContext", "AudioContextOptions", "AudioBuffer", "AudioBufferSourceNode",
  "AudioDestinationNode", "AudioNode", "AudioScheduledSourceNode", "BaseAudioContext",
  "Storage", "Navigator", "Gamepad", "GamepadButton", "Performance",
  "CssStyleDeclaration", "console",
  "DragEvent", "DataTransfer", "MouseEvent", "HtmlDialogElement", "HtmlSelectElement",
  "HtmlAnchorElement", "Url", "BlobPropertyBag", "GainNode", "AudioParam", "DomTokenList",
  "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction",
  "IdbTransactionMode", "IdbObjectStore", "DomStringList", "DomException", "IdbVersionChangeEvent",
  "Response",
] }
